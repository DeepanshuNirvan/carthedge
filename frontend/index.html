<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090A0D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- .json, not .webmanifest: the Go static handler has no MIME entry for it -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>CartHedge — The AI order desk for Instagram & WhatsApp sellers</title>
    <script>
      // set theme before first paint; marketing defaults dark, apps follow system
      (function () {
        var saved = localStorage.getItem('carthedge-theme');
        var path = location.pathname;
        var isApp = path.startsWith('/app') || path.startsWith('/admin');
        var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = saved || (isApp ? system : 'dark');
        document.documentElement.dataset.theme = theme;
        // browser chrome matches --bg of the resolved theme, not the OS setting
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '#090A0D' : '#EEEBE5';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
